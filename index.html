<!doctype html>
<html lang="en" data-theme="warm">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123b3a" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>CCTC Practice Exam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Prevent FOUC: apply theme + dark mode before React hydrates -->
    <script>
      try {
        var t = localStorage.getItem('cctc-theme');
        if (t === 'clinical' || t === 'warm' || t === 'modern') document.documentElement.setAttribute('data-theme', t);
        var m = localStorage.getItem('cctc-color-mode');
        if (m === 'dark' || (!m && matchMedia('(prefers-color-scheme:dark)').matches)) document.documentElement.classList.add('dark');
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
