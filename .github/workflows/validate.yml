name: Validate Question Bank

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install poppler utilities
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Fetch and index OPTN policies PDF
        run: npm run reference:fetch-optn && npm run reference:index -- optn-policies

      # CI subset: schema + integrity + reference format + OPTN-indexed content.
      # Textbook anchor content requires local `npm run reference:index && npm run validate` before merge.
      # See .github/prompts/03-validate.md and docs/reference/verification-stubs/README.md.
      - name: Run question bank validation (CI subset)
        run: npm run validate:ci

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build app for browser tests
        run: npm run build

      - name: Run browser resume tests (Playwright runner)
        env:
          CI: true
        run: npm run test:e2e:playwright