name: Design Contract Verification

on:
  push:
    branches: [main, develop, 'redesign/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start dev server
        run: npm run dev &
        # d2cc will also try to auto-start via devCommand, but starting
        # it here as a fallback ensures the server is ready before
        # Playwright screenshots run.

      - name: Wait for dev server
        run: |
          for i in $(seq 1 30); do
            if curl -s --connect-timeout 1 http://localhost:5173 > /dev/null 2>&1; then
              echo "Dev server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Dev server did not start within 30s — screenshots will be skipped"

      - name: Run design contract verification
        run: npx d2cc verify
        # d2cc exits 1 if any check fails. Screenshots require Playwright
        # + running dev server (both set up above). DOM class diff always runs.

      - name: Upload visual regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression
          path: visual-regression/
          if-no-files-found: ignore
          retention-days: 14
