  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

; }\n  * { box-sizing:border-box; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div ref=\"{{ rootRef }}\" style=\"--bg:#f4efe6; --surface:#fffdf9; --surface2:#faf5ec; --ink:#221d16; --muted:#6f6557; --line:#e6dcc9; --line2:#ddd2bf; --teal:#123b3a; --teal2:#0d2e2d; --tealtext:#123b3a; --tealsoft:#dcebe6; --gold:#b07a3c; --goldtext:#946530; --goldsoft:#f0e4cf; --success:#2f7d5b; --successtext:#2f7d5b; --successsoft:#dcebe0; --expline:#bcdcc8; --danger:#a8443b; --dangertext:#a8443b; --dangersoft:#f3ddd9; --ring:#e9dec8; --letterbg:#f0e8d8; --switchoff:#d8cdb8; --inputdis:#efe9dd; --resumeline:#b9d7ce; --headerbg:rgba(255,253,249,.86); --shadow:rgba(34,29,22,.14); --serif:'Newsreader',Georgia,serif; --sans:'Public Sans',system-ui,sans-serif; min-height:100vh; background:var(--bg); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; transition:background .2s ease, color .2s ease;\">\n\n  <!-- ============ DISCLAIMER ============ -->\n  <sc-if value=\"{{ showDisclaimer }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; z-index:50; background:rgba(20,17,12,.55); display:grid; place-items:center; padding:20px;\">\n      <div style=\"width:min(520px,100%); background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:28px; box-shadow:0 24px 70px rgba(20,17,12,.4);\">\n        <div style=\"font:600 11px/1 var(--sans); letter-spacing:.16em; text-transform:uppercase; color:var(--goldtext);\">Independent study aid<\u002Fdiv>\n        <h2 style=\"font-family:var(--serif); font-size:24px; font-weight:600; margin:12px 0 12px; color:var(--ink);\">Before you begin<\u002Fh2>\n        <p style=\"font-size:14px; line-height:1.6; color:var(--muted); margin:0 0 22px;\">This practice app is not affiliated with or endorsed by ABTC or PSI, does not reproduce real exam items, and is not a source of patient-care decisions. Practice results are unofficial estimates only.<\u002Fp>\n        <button onclick=\"{{ ackDisclaimer }}\" style=\"width:100%; padding:14px; border:none; border-radius:11px; background:var(--teal); color:#fff; font:600 14px var(--sans); cursor:pointer;\">I understand<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ START PROMPT ============ -->\n  <sc-if value=\"{{ startPromptOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; z-index:50; background:rgba(20,17,12,.55); display:grid; place-items:center; padding:20px;\">\n      <div style=\"width:min(480px,100%); background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:24px; box-shadow:0 24px 70px rgba(20,17,12,.4);\">\n        <h2 style=\"font-family:var(--serif); font-size:21px; font-weight:600; margin:0 0 8px; color:var(--ink);\">Session in progress<\u002Fh2>\n        <p style=\"font-size:13.5px; line-height:1.55; color:var(--muted); margin:0 0 6px;\">You have an unfinished session. Resume it, or start a new one — starting new discards your in-progress answers and bookmarks.<\u002Fp>\n        <p style=\"font-size:12.5px; color:var(--tealtext); background:var(--tealsoft); border-radius:9px; padding:9px 12px; margin:0 0 18px;\">New session: {{ pendingStartSummary }}<\u002Fp>\n        <div style=\"display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap;\">\n          <button onclick=\"{{ cancelStart }}\" style=\"padding:11px 16px; border:1px solid var(--line2); border-radius:10px; background:var(--surface); color:var(--ink); font:600 13px var(--sans); cursor:pointer;\">Cancel<\u002Fbutton>\n          <button onclick=\"{{ startNewAnyway }}\" style=\"padding:11px 16px; border:1px solid var(--line2); border-radius:10px; background:var(--surface2); color:var(--ink); font:600 13px var(--sans); cursor:pointer;\">Start new<\u002Fbutton>\n          <button onclick=\"{{ resumeFromPrompt }}\" style=\"padding:11px 16px; border:none; border-radius:10px; background:var(--teal); color:#fff; font:600 13px var(--sans); cursor:pointer;\">Resume current<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ SUBMIT CONFIRM ============ -->\n  <sc-if value=\"{{ confirmOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; z-index:50; background:rgba(20,17,12,.55); display:grid; place-items:center; padding:20px;\">\n      <div style=\"width:min(440px,100%); background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:24px; box-shadow:0 24px 70px rgba(20,17,12,.4);\">\n        <h2 style=\"font-family:var(--serif); font-size:21px; font-weight:600; margin:0 0 8px; color:var(--ink);\">{{ confirmTitle }}<\u002Fh2>\n        <p style=\"font-size:13.5px; line-height:1.55; color:var(--muted); margin:0 0 20px;\">{{ confirmBody }}<\u002Fp>\n        <div style=\"display:flex; gap:10px; justify-content:flex-end;\">\n          <button onclick=\"{{ onConfirmCancel }}\" style=\"padding:11px 16px; border:1px solid var(--line2); border-radius:10px; background:var(--surface); color:var(--ink); font:600 13px var(--sans); cursor:pointer;\">Keep going<\u002Fbutton>\n          <button onclick=\"{{ onConfirmYes }}\" style=\"padding:11px 16px; border:none; border-radius:10px; background:var(--teal); color:#fff; font:600 13px var(--sans); cursor:pointer;\">{{ confirmCta }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ REPORT MODAL ============ -->\n  <sc-if value=\"{{ reportOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; z-index:50; background:rgba(20,17,12,.55); display:grid; place-items:center; padding:20px;\">\n      <div style=\"width:min(480px,100%); background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:24px; box-shadow:0 24px 70px rgba(20,17,12,.4);\">\n        <h2 style=\"font-family:var(--serif); font-size:21px; font-weight:600; margin:0 0 4px; color:var(--ink);\">Report an issue<\u002Fh2>\n        <p style=\"font-size:13px; color:var(--muted); margin:0 0 18px;\">Flag this item for SME review. Saved on this device.<\u002Fp>\n        <label style=\"display:block; font:600 12px var(--sans); color:var(--ink); margin-bottom:6px;\">Reason<\u002Flabel>\n        <select value=\"{{ reportReason }}\" onchange=\"{{ onReportReason }}\" style=\"width:100%; padding:11px 12px; border:1px solid var(--line2); border-radius:10px; background:var(--surface2); font:400 14px var(--sans); color:var(--ink); margin-bottom:16px;\">\n          <option value=\"factual error\">Factual error<\u002Foption>\n          <option value=\"outdated policy/guideline\">Outdated policy/guideline<\u002Foption>\n          <option value=\"ambiguous / &gt;1 defensible answer\">Ambiguous / more than one defensible answer<\u002Foption>\n          <option value=\"typo / wording\">Typo / wording<\u002Foption>\n          <option value=\"broken or wrong reference link\">Broken or wrong reference link<\u002Foption>\n          <option value=\"other\">Other<\u002Foption>\n        <\u002Fselect>\n        <label style=\"display:block; font:600 12px var(--sans); color:var(--ink); margin-bottom:6px;\">Comment<\u002Flabel>\n        <textarea rows=\"4\" value=\"{{ reportComment }}\" onchange=\"{{ onReportComment }}\" style=\"width:100%; padding:11px 12px; border:1px solid var(--line2); border-radius:10px; background:var(--surface2); font:400 14px var(--sans); color:var(--ink); resize:vertical;\"><\u002Ftextarea>\n        <div style=\"display:flex; gap:10px; margin-top:18px; justify-content:flex-end;\">\n          <button onclick=\"{{ closeReport }}\" style=\"padding:11px 18px; border:1px solid var(--line2); border-radius:10px; background:var(--surface); color:var(--ink); font:600 13px var(--sans); cursor:pointer;\">Cancel<\u002Fbutton>\n          <button onclick=\"{{ saveReport }}\" style=\"padding:11px 18px; border:none; border-radius:10px; background:var(--teal); c {{ t.style }}\">{{ t.label }}<\u002Fbutton><\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:24px;\">\n          <div style=\"display:flex; gap:8px; margin-bottom:14px;\">\n            <span style=\"font:600 11px var(--sans); color:var(--tealtext); background:var(--tealsoft); padding:5px 11px; border-radius:7px;\">{{ rvCategory }}<\u002Fspan>\n            <span style=\"font:600 11px var(--sans); padding:5px 11px; border-radius:7px; {{ rvVerdictStyle }}\">{{ rvVerdict }}<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-family:var(--serif); font-size:19px; line-height:1.5; color:var(--ink); margin:0 0 18px;\">{{ rvStem }}<\u002Fp>\n          <div style=\"display:flex; flex-direction:column; gap:10px;\">\n            <sc-for list=\"{{ rvOptions }}\" as=\"opt\" hint-placeholder-count=\"4\">\n              <div style=\"{{ opt.containerStyle }}\">\n                <span style=\"{{ opt.letterStyle }}\">{{ opt.letter }}<\u002Fspan>\n                <span style=\"font-size:14px; color:var(--ink); line-height:1.4; padding-top:3px;\">{{ opt.text }}<sc-if value=\"{{ opt.hasNote }}\" hint-placeholder-val=\"{{ false }}\"><small style=\"display:block; font-weight:600; margin-top:3px; {{ opt.noteStyle }}\">{{ opt.note }}<\u002Fsmall><\u002Fsc-if><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"margin-top:18px; background:var(--surface2); border:1px solid var(--line); border-radius:13px; padding:18px;\">\n            <div style=\"font:700 11px var(--sans); letter-spacing:.1em; text-transform:uppercase; color:var(--successtext); margin-bottom:9px;\">{{ rvExpHeader }}<\u002Fdiv>\n            <p style=\"font-size:13.5px; line-height:1.55; color:var(--ink); margin:0 0 12px;\">{{ rvExpCorrect }}<\u002Fp>\n            <sc-for list=\"{{ rvExpIncorrect }}\" as=\"x\" hint ceholder-val=\"{{ false }}\"><button onclick=\"{{ clearHistory }}\" style=\"padding:9px 14px; border:1px solid var(--line2); border-radius:9px; background:var(--surface); color:var(--muted); font:600 12.5px var(--sans); cursor:pointer;\">Clear history<\u002Fbutton><\u002Fsc-if>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ noHistory }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:40px; text-align:center;\">\n            <p style=\"font-size:14px; color:var(--muted); margin:0 0 16px;\">No completed sessions yet.<\u002Fp>\n            <button onclick=\"{{ goSetup }}\" style=\"padding:12px 18px; border:none; border-radius:11px; background:var(--teal); color:#fff; font:600 13px var(--sans); cursor:pointer;\">Start a session<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hasHistory }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(280px,1fr));\">\n            <div style=\"background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px;\">\n              <div style=\"font:600 11px var(--sans); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:14px;\">Score trend<\u002Fdiv>\n              <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px;\">\n                <div><div style=\"font-size:11px; color:var(--muted);\">Average<\u002Fdiv><div style=\"font-family:var(--serif); font-size:22px; font-weight:600; color:var(--ink);\">{{ histAvg }}%<\u002Fdiv><\u002Fdiv>\n                <div><div style=\"font-size:11px; color:var(--muted);\">Best<\u002Fdiv><div style=\"font-family:var(--serif); font-size:22px; font-weight:600; color:var(--ink);\">{{ histBest }}%<\u002Fdiv><\u002Fdiv>\n                <div><div style=\"font-size:11px; color:var(--muted);\">Latest<\u002Fdiv><div style=\"font-family:var(--serif); font-size:22px; font-weight:600; {{ histDeltaStyle }}\">{{ histDelta }}<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex; align-items:flex-end; gap:6px; height:120px;\">\n                <sc-for list=\"{{ trendBars }}\" as=\"t\" hint-placeholder-count=\"6\"><div style=\"flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:5px;\"><div style=\"{{ t.fillStyle }}\"><\u002Fdiv><span style=\"font-size:10px; color:var(--muted);\">{{ t.label }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px;\">\n              <div style=\"font:600 11px var(--sans); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:14px;\">By domain<\u002Fdiv>\n              <sc-for list=\"{{ domainBars }}\" as=\"d\" hint-placeholder-count=\"3\"><div style=\"margin-bottom:14px;\"><div style=\"display:flex; justify-content:space-between; font-size:13px; color:var(--ink); margin-bottom:6px;\"><span>{{ d.name }}<\u002Fspan><span style=\"color:var(--muted);\">{{ d.pctLabel }}<\u002Fspan><\u002Fdiv><div style=\"height:8px; border-radius:5px; background:var(--goldsoft);\"><div style=\"{{ d.fillStyle }}\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex; flex-direction:column; gap:10px;\">\n            <sc-for list=\"{{ historyRows }}\" as=\"h\" hint-placeholder-count=\"4\">\n              <div style=\"background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;\">\n                <div>\n                  <div style=\"display:flex; align-items:center; gap:8px;\"><span style=\"font:600 14px var(--sans); color:var(--ink);\">{{ h.scoreText }}<\u002Fspan><sc-if value=\"{{ h.isSample }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font:600 10px var(--sans); letter-spacing:.06em; text-transform:uppercase; color:var(--goldtext); background:var(--goldsoft); padding:3px 7px; border-radius:5px;\">Sample<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n                  <div style=\"font-size:12.5px; color:var(--muted); margin-top:3px;\">{{ h.metaText }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex; gap:8px;\">\n                  <sc-if value=\"{{ h.canReview }}\" hint-placeholder-val=\"{{ false }}\"><button onclick=\"{{ h.onReview }}\" style=\"padding:9px 14px; border:1px solid var(--line2); border-radius:9px; background:var(--surface2); color:var(--tealtext); font:600 12.5px var(--sans); cursor:pointer;\">Review<\u002Fbutton><\u002Fsc-if>\n                  <button onclick=\"{{ h.onDelete }}\" style=\"padding:9px 12px; border:1px solid var(--line2); border-radius:9px; background:transparent; color:var(--muted); font:600 12.5px var(--sans); cursor:pointer;\">Delete<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ hasFlags }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:var(--surface2); border:1px solid var(--line); border-radius:14px; padding:16px 18px; display:flex; justify-content:space-between; align-items:center; gap:12px;\">\n              <div><div style=\"font:600 13px var(--sans); color:var(--ink);\">{{ flagsCountText }}<\u002Fdiv><div style=\"font-size:12px; color:var(--muted); margin-top:2px;\">Reported items, stored on this device<\u002Fdiv><\u002Fdiv>\n              <button onclick=\"{{ clearFlags }}\" style=\"padding:9px 14px; border:1px solid var(--line2); border-radius:9px; background:var(--surface); color:var(--muted); font:600 12.5px var(--sans); cursor:pointer;\">Clear<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n\n  <footer style=\"border-top:1px solid var(--line); margin-top:20px;\">\n    <div style=\"max-width:940px; margin:0 auto; padding:18px 20px 40px; font-size:11.5px; line-height:1.5; color:var(--muted);\">Independent study aid · not affiliated with or endorsed by ABTC or PSI · does not reproduce real exam questions · not a source of patient-care decisions. Practice results are unofficial estimates.<\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;targetThreshold&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:70,&quot;min&quot;:50,&quot;max&quot;:90,&quot;tsType&quot;:&quot;number&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#b07a3c&quot;,&quot;options&quot;:[&quot;#b07a3c&quot;,&quot;#a8443b&quot;,&quot;#1f6a4b&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;startMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;exam&quot;,&quot;study&quot;],&quot;default&quot;:&quot;exam&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nconst LS = { prefs:'cctc.prefs.v2', history:'cctc.history.v2', session:'cctc.session.v2' };\nfunction load(k,f){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):f; }catch(e){ return f; } }\nfunction save(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }\nfunction shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=r[i]; r[i]=r[j]; r[j]=t; } return r; }\nfunction uid(){ return 'id-'+Date.now()+'-'+Math.floor(Math.random()*1e6); }\nfunction clock(s){ if(s==null) return 'Untimed'; const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), x=s%60; return [h,m,x].map(n=>String(n).padStart(2,'0')).join(':'); }\nfunction shortDate(t){ try{ return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }catch(e){ return ''; } }\n\nconst THEME = {\n  day: { '--bg':'#f4efe6','--surface':'#fffdf9','--surface2':'#faf5ec','--ink':'#221d16','--muted':'#6f6557','--line':'#e6dcc9','--line2':'#ddd2bf','--teal':'#123b3a','--teal2':'#0d2e2d','--tealtext':'#123b3a','--tealsoft':'#dcebe6','--gold':'#b07a3c','--goldtext':'#946530','--goldsoft':'#f0e4cf','--success':'#2f7d5b','--successtext':'#2f7d5b','--successsoft':'#dcebe0','--expline':'#bcdcc8','--danger':'#a8443b','--dangertext':'#a8443b','--dangersoft':'#f3ddd9','--ring':'#e9dec8','--letterbg':'#f0e8d8','--switchoff':'#d8cdb8','--inputdis':'#efe9dd','--resumeline':'#b9d7ce','--headerbg':'rgba(255,253,249,.86)','--shadow':'rgba(34,29,22,.14)' },\n  night: { '--bg':'#17140f','--surface':'#211d16','--surface2':'#2a251c','--ink':'#f1ebdf','--muted':'#aa9f8c','--line':'#332d24','--line2':'#443d31','--teal':'#1d544f','--teal2':'#16423e','--tealtext':'#7cc2b4','--tealsoft':'rgba(124,194,180,.16)','--gold':'#c79a5a','--goldtext':'#dab06a','--goldsoft':'rgba(202,154,90,.16)','--success':'#3f9d72','--successtext':'#73c79e','--successsoft':'rgba(79,174,130,.16)','--expline':'rgba(115,199,158,.28)','--danger':'#cf7a70','--dangertext':'#e49b91','--dangersoft':'rgba(207,122,112,.16)','--ring':'#3a332a','--letterbg':'#383027','--switchoff':'#443d31','--inputdis':'#262119','--resumeline':'rgba(124,194,180,.4)','--headerbg':'rgba(33,29,22,.86)','--shadow':'rgba(0,0,0,.45)' }\n};\n\nclass Component extends DCLogic {\n  state = {\n    ready:false, view:'home', homeMode:'dashboard', disclaimerSeen:false, theme:'day',\n    QUESTIONS:[], SCENARIOS:[], DOMAINS:[],\n    settings:{ mode:'exam', questionSet:'standard', timed:true, timeMinutes:180, showTimer:true, count:10, domains:'all', blueprint:'cctc-from-2026-07', includeDrafts:false },\n    session:null, completed:null, reviewIndex:0, reviewFrom:'results',\n    history:[], flags:[], lastCustom:null,\n    menuOpen:false, mapOpen:false, reviewMapOpen:false, advancedOpen:false,\n    startPromptOpen:false, pendingStart:null, confirmOpen:false,\n    reportOpen:false, reportReason:'factual error', reportComment:''\n  };\n\n  target(){ return this.props.targetThreshold ?? 70; }\n\n  loadData(){\n    // Prefer the classic-script global (works when opened via file:// by double-click).\n    // Fall back to an ES-module import (works when served over http with a module file).\n    return new Promise(async (resolve)=>{\n      for(let i=0;i<60;i++){ if(window.CCTC_DATA){ resolve(window.CCTC_DATA); return; } await new Promise(r=>setTimeout(r,25)); }\n      try { const m = await import('./cctc-data.js'); if(m && (m.QUESTIONS||m.DOMAINS)){ resolve(m); return; } } catch(e){}\n      resolve(window.CCTC_DATA || { QUESTIONS:[], SCENARIOS:[], DOMAINS:[] });\n    });\n  }\n\n  async componentDidMount(){\n    const mod = await this.loadData();\n    const prefs = load(LS.prefs, {});\n    let history = load(LS.history, []);\n    const session = load(LS.session, null);\n    if((!history || history.length===0) && !prefs.seeded){\n      history = this.seedHistory(mod.DOMAINS);\n      save(LS.history, history);\n    }\n    let theme = prefs.theme;\n    if(theme!=='day' && theme!=='night'){\n      theme = 'day';\n      try { if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme='night'; } catch(e){}\n    }\n    this.setState({\n      ready:true,\n      QUESTIONS: mod.QUESTIONS||[], SCENARIOS: mod.SCENARIOS||[], DOMAINS: mod.DOMAINS||[],\n      homeMode: prefs.homeMode || 'dashboard',\n      disclaimerSeen: !!prefs.disclaimerSeen,\n      flags: prefs.flags || [],\n      lastCustom: prefs.lastCustom || null,\n      theme, history, session,\n      settings: { ...this.state.settings, mode: this.props.startMode || 'exam', count: Math.min(10, (mod.QUESTIONS||[]).length||10) }\n    }, ()=>{ this.persistPrefs({seeded:true}); this.applyTheme(); });\n    this.timer = setInterval(()=>this.tick(), 1000);\n  }\n  componentDidUpdate(){ this.applyTheme(); }\n  componentWillUnmount(){ clearInterval(this.timer); }\n  applyTheme(){\n    if(!this.rootEl) return;\n    const t = THEME[this.state.theme==='night'?'night':'day'];\n    Object.keys(t).forEach(k=> this.rootEl.style.setProperty(k, t[k]));\n    if(this.props.accent) this.rootEl.style.setProperty('--gold', this.props.accent);\n    try { document.body.style.background = t['--bg']; } catch(e){}\n  }\n  toggleTheme(){ this.setState(s=>({ theme: s.theme==='night'?'day':'night' }), ()=>{ this.persistPrefs(); this.applyTheme(); }); }\n\n  seedHistory(domains){\n    const ds = domains && domains.length? domains : [{id:1,short:'Education'},{id:2,short:'Pre-transplant'},{id:3,short:'Post-op'}];\n    const targets = { 1:78, 2:70, 3:61 };\n    const overalls = [62,66,67,71,73,78];\n    const day = 86400000;\n    const out = [];\n    overalls.forEach((pct, i)=>{\n      const breakdown = ds.map(d=>{\n        const base = targets[d.id] || 70;\n        const jitter = (pct-70);\n        const p = Math.max(40, Math.min(96, base + jitter + (Math.random()*8-4)));\n        const total = d.id===3?7:6;\n        const correct = Math.round(total * p/100);\n        return { domain:d.id, name:d.short, correct, total, percent: Math.round(correct/total*100) };\n      });\n      const correct = breakdown.reduce((a,b)=>a+b.correct,0);\n      const total = breakdown.reduce((a,b)=>a+b.total,0);\n      out.unshift({\n        id:'sample-'+i, completedAt: Date.now() - (overalls.length-i)*3*day,\n        settings:{ mode: i%3===0?'study':'exam', target:this.target() },\n        result:{ correct, total, percent: Math.round(correct/total*100), estimatedPass: (correct/total*100)>=this.target(), breakdown },\n        timeUsedSeconds: 5400 + i*200, sample:true\n      });\n    });\n    return out;\n  }\n\n  persistPrefs(extra){ save(LS.prefs, { homeMode:this.state.homeMode, disclaimerSeen:this.state.disclaimerSeen, flags:this.state.flags, theme:this.state.theme, lastCustom:this.state.lastCustom, seeded:true, ...extra }); }\n\n  setView(v){ this.setState({ view:v, menuOpen:false, mapOpen:false }); }\n  ackDisclaimer(){ this.setState({ disclaimerSeen:true }, ()=>this.persistPrefs()); }\n  setHomeMode(m){ this.setState({ homeMode:m }, ()=>this.persistPrefs()); }\n\n  bank(settings){ return (settings.questionSet==='scenario'? this.state.SCENARIOS : this.state.QUESTIONS) || []; }\n  setSetting(p){ this.setState(s=>{ const ns={...s.settings,...p}; const max=this.avail(ns); ns.count=Math.max(1, Math.min(ns.count, max||1)); return { settings:ns }; }); }\n  avail(settings){ const ds=settings.domains; return this.bank(settings).filter(q=> ds==='all'||ds.indexOf(q.domain)>=0).length; }\n\n  toggleDomain(id){\n    if(id==='all'){ this.setSetting({ domains:'all' }); return; }\n    let cur = this.state.settings.domains; cur = cur==='all'? [] : cur.slice();\n    const i = cur.indexOf(id); if(i>=0) cur.splice(i,1); else cur.push(id);\n    this.setSetting({ domains: cur.length? cur : 'all' });\n  }\n  domainsLabel(domains){ if(domains==='all') return 'All domains'; return domains.map(id=>{ const d=(this.state.DOMAINS||[]).find(x=>x.id===id); return d?d.short:('D'+id); }).join(', '); }\n  summary(s){ return (s.mode==='exam'?'Exam':'Study')+' · '+this.domainsLabel(s.domains)+' · '+s.count+' items · '+(s.timed? s.timeMinutes+' min':'untimed')+(s.questionSet==='scenario'?' · scenario':''); }\n\n  buildSession(settings){\n    const ds=settings.domains;\n    let pool=this.bank(settings).filter(q=> ds==='all'||ds.indexOf(q.domain)>=0);\n    pool=shuffle(pool);\n    const count=Math.min(settings.count, pool.length);\n    const items=pool.slice(0,count).map(q=>({ q, optionOrder: shuffle(q.options.map(o=>o.id)) }));\n    return { id:uid(), createdAt:Date.now(), settings:{...settings}, items, answers:{}, revealed:{}, bookmarks:[], currentIndex:0, remainingSeconds: settings.timed? settings.timeMinutes*60 : null, submittedAt:null };\n  }\n  startSession(settings){ const sess=this.buildSession(settings); if(!sess.items.length){ this.setState({ bankError:true, startPromptOpen:false, pendingStart:null, view: (this.state.homeMode==='setup'?'home':'setup') }); return; } this.setState({ bankError:false, session:sess, completed:null, view:'session', menuOpen:false, mapOpen:false, startPromptOpen:false, pendingStart:null }); save(LS.session, sess); }\n\n  startFlow(settings){\n    if(this.state.session && !this.state.session.submittedAt){\n      this.setState({ startPromptOpen:true, pendingStart:settings });\n    } else {\n      this.startSession(settings);\n    }\n  }\n  resumeFromPrompt(){ this.setState({ startPromptOpen:false, pendingStart:null, view:'session' }); }\n  startNewAnyway(){ const s=this.state.pendingStart; if(s) this.startSession(s); else this.setState({startPromptOpen:false}); }\n  cancelStart(){ this.setState({ startPromptOpen:false, pendingStart:null }); }\n\n  preset(name){\n    const all=(this.state.QUESTIONS||[]).length;\n    let s;\n    if(name==='full') s={ ...this.state.settings, mode:'exam', questionSet:'standard', timed:true, timeMinutes:180, showTimer:true, domains:'all', count:all, includeDrafts:false };\n    else if(name==='quick') s={ ...this.state.settings, mode:'exam', questionSet:'standard', timed:false, domains:'all', count:Math.min(10,all) };\n    else { const weak=this.weakDomains(); const dms= weak.length? weak.map(w=>w.id) : 'all'; s={ ...this.state.settings, mode:'study', questionSet:'standard', timed:false, domains: dms, count:Math.min(10,all) }; }\n    this.setState({ settings:s });\n    this.startFlow(s);\n  }\n\n  domainAgg(){ const agg={}; (this.state.history||[]).forEach(e=> (e.result.breakdown||[]).forEach(b=>{ agg[b.domain]=agg[b.domain]||{c:0,t:0}; agg[b.domain].c+=b.correct; agg[b.domain].t+=b.total; })); return agg; }\n  domainPct(id){ const agg=this.domainAgg(); const a=agg[id]; return a&&a.t? a.c/a.t*100 : null; }\n  // Weak = every domain whose pooled accur
